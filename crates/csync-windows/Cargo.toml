[package]
name = "csync-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "CSync"
path = "src/main.rs"

[dependencies]
csync-core = { path = "../csync-core" }
anyhow.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
uuid.workspace = true
socket2 = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry",
  "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography",
  "Win32_Globalization",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls",
  "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_StationsAndDesktops"
  , "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"
] }
wry = { version = "0.57.1", default-features = false, features = ["os-webview"] }
raw-window-handle = "0.6"

[build-dependencies]
serde_json.workspace = true
