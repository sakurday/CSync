[workspace]
members = ["crates/csync-core", "crates/csync-windows"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
rcgen = { version = "0.14", features = ["ring"], default-features = false }
rustls = { version = "0.23", features = ["ring", "std", "tls12"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", features = ["ring", "tls12"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
